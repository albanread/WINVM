[package]
name = "winvm-gui"
version = "0.0.0"
edition = "2021"
description = "WINVM graphical environment — the Strongtalk HTML programming environment hosted in a native shell (WebView2 on Windows, Cocoa/WKWebView on macOS). See PLAN.md and ../MIGRATION.md §6."
license = "BSD-2-Clause"
publish = false

[[bin]]
name = "winvm-gui"
path = "src/main.rs"

[dependencies]
# The web assets, the page pipeline, and the VM worker are all portable; only
# the shell (src/shell/) is platform-specific — see src/shell/mod.rs.
macvm-mock-vm = { path = "mock_vm" }
# The real (`docs/IMAGE.md`) versioned SQLite world — mirrored into a
# `MockWorld` at startup when `MACVM_IMAGE_PATH` is set (`vm_host.rs`),
# with edits written through to both so they persist across restarts.
image_store = { path = "../image_store" }
# The real VM (SPEC A18/§16.2) — VmHandle/eval/TranscriptSink for the
# Workspace's Doit/WorkspacePrintIt (S21 step 3).
macvm = { path = ".." }

# ── macOS shell (src/shell/mac.rs) ─────────────────────────────────────────
# Deliberately zero external crates for the Cocoa/AppKit/WebKit bridge: a
# minimal dlopen/dlsym/objc_msgSend layer (src/objc.rs), the same proven,
# dependency-free approach already used in the sibling MacModula2 project.

# ── Windows shell (src/shell/win.rs) ───────────────────────────────────────
# WebView2 (MIGRATION.md §6 / risk table: ships with Win11, Evergreen
# bootstrap for distribution) plus hand-rolled Win32 for the window, menu
# bar, timers, and the worker->main-thread wakeup. `webview2-com` 0.39 and
# `windows` 0.62 are a matched pair — webview2-com-sys depends on exactly
# this `windows` version, so the COM interface types are the same types.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = []
# The native Metal game pane (docs/gamepane_design.md) and the game demos.
# OFF by default and macOS-only: it needs a MacGamePane checkout beside this
# repo, and MIGRATION.md §1 defers the game demos (D3D11/XAudio2) on Windows.
# A cargo *feature* rather than a bare `cfg(target_os)` because the path
# dependencies below cannot even be resolved without that checkout present.
gamepane = ["dep:macgamepane-graphics", "dep:macgamepane-audio", "dep:metal", "dep:core-graphics-types"]

[target.'cfg(target_os = "macos")'.dependencies]
# MacGamePane game engine (docs/gamepane_design.md). The GUI crate owns AppKit,
# so the native Metal game pane is built in here. `metal` is pinned to 0.33 to
# match MacGamePane's boundary types (metal::Device / CommandBufferRef /
# TextureRef) so the handles type-match.
macgamepane-graphics = { path = "../../MacGamePane/graphics", optional = true }
macgamepane-audio = { path = "../../MacGamePane/audio", optional = true }
metal = { version = "0.33", optional = true }
# CGSize for CAMetalLayer::set_drawable_size (same version the graphics crate
# and the metal crate already use).
core-graphics-types = { version = "0.2", optional = true }
